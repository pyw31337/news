<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>렛츠뉴스</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root { --orange: #FF6B00; --navy: #1A2332; --cream: #FAF7F2; --gray: #5A6570; --shadow: 0 8px 28px rgba(0,0,0,.07); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', system-ui, sans-serif; background: var(--cream); color: var(--navy); padding-bottom: 80px; }
    a { text-decoration: none; color: inherit; }

    header { background:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #eee; position:sticky; top:0; z-index:100; }
    .logo { font-weight:800; font-size:22px; color:var(--orange); }
    .logo span { color:var(--navy); }
    .tagline { font-size:12px; color:var(--gray); margin-left:8px; }
    .header-actions { display:flex; gap:14px; font-size:14px; font-weight:600; color:var(--gray); }

    .hero-slider { position:relative; height:440px; overflow:hidden; }
    .slide { position:absolute; inset:0; background-size:cover; background-position:center; display:flex; align-items:flex-end; color:#fff; opacity:0; transition:opacity .7s; }
    .slide.active { opacity:1; }
    .slide::before { content:''; position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,.05)); }
    .slide-content { position:relative; padding:28px 18px 40px; max-width:1100px; margin:0 auto; width:100%; }
    .slide h2 { font-size:clamp(24px,6.5vw,40px); font-weight:800; line-height:1.25; margin-bottom:8px; }
    .slide .meta { font-size:14px; opacity:.9; }

    section { padding:32px 16px; max-width:1100px; margin:0 auto; }
    h2.sec { font-size:22px; font-weight:800; margin-bottom:6px; }
    .sec-sub { font-size:13.5px; color:var(--gray); margin-bottom:18px; }

    .rank-scroll { display:flex; gap:14px; overflow-x:auto; padding:8px 0 12px; scroll-snap-type:x mandatory; }
    .rank-item { flex:0 0 170px; scroll-snap-align:start; position:relative; }
    .rank-num { position:absolute; left:-10px; top:45%; transform:translateY(-50%); font-size:80px; font-weight:900; color:rgba(255,255,255,.92); text-shadow:0 4px 12px rgba(0,0,0,.35); z-index:2; pointer-events:none; }
    .rank-thumb { height:240px; border-radius:14px; background-size:cover; background-position:center; position:relative; overflow:hidden; box-shadow:var(--shadow); }
    .rank-thumb::after { content:''; position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,.75),transparent 55%); }
    .rank-info { position:absolute; bottom:14px; left:14px; right:14px; color:#fff; z-index:1; }
    .rank-info h3 { font-size:15px; font-weight:700; line-height:1.35; margin-bottom:4px; }
    .rank-count { font-size:12px; opacity:.9; }

    .mixed-grid { display:grid; gap:16px; }
    @media (min-width:700px) { .mixed-grid { grid-template-columns:1.4fr 1fr; } }
    .featured { background:#fff; border-radius:18px; overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; }
    .featured .img { height:200px; background-size:cover; background-position:center; }
    .featured-body { padding:16px; }
    .featured h3 { font-size:18px; font-weight:800; margin-bottom:6px; }

    .compact-list { display:flex; flex-direction:column; gap:10px; }
    .compact-item { display:flex; gap:12px; background:#fff; border-radius:12px; padding:10px; box-shadow:0 2px 12px rgba(0,0,0,.05); }
    .compact-item .thumb { width:72px; height:72px; border-radius:8px; background-size:cover; flex-shrink:0; }
    .compact-item h4 { font-size:14.5px; font-weight:700; line-height:1.35; }

    .entity-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .tag { font-size:11px; background:#FFF3E8; color:var(--orange); padding:3px 9px; border-radius:12px; font-weight:600; }

    .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #eee; display:flex; justify-content:space-around; padding:8px 0 calc(8px + env(safe-area-inset-bottom)); z-index:100; }
    .bottom-nav button { background:none; border:none; font-family:inherit; display:flex; flex-direction:column; align-items:center; font-size:11px; font-weight:600; color:var(--gray); gap:2px; cursor:pointer; }
    .bottom-nav button.active { color:var(--orange); }
    .bottom-nav svg { width:22px; height:22px; }
    @media (min-width:768px) { .bottom-nav { display:none; } .hero-slider { height:520px; } }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:baseline;">
      <div class="logo">렛츠<span>뉴스</span></div>
      <div class="tagline">오늘의 이슈를 따라가다</div>
    </div>
    <div class="header-actions"><span>검색</span><span>메뉴</span></div>
  </header>

  <div class="hero-slider" id="hero"></div>

  <section>
    <h2 class="sec">오늘 가장 많이 회자된 뉴스</h2>
    <p class="sec-sub">거론 횟수 기준 순위</p>
    <div class="rank-scroll" id="rank-list"></div>
  </section>

  <section style="background:#fff; border-radius:24px 24px 0 0;">
    <h2 class="sec">지금 핫한 인물 · 사건</h2>
    <p class="sec-sub">엔티티 중심으로 연결된 흐름</p>
    <div class="mixed-grid" id="entities"></div>
  </section>

  <section>
    <h2 class="sec">테마별 이슈</h2>
    <p class="sec-sub">정치 · 경제 · IT · 외교</p>
    <div class="compact-list" id="themes"></div>
  </section>

  <nav class="bottom-nav">
    <button class="active"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>오늘</button>
    <button><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>타임라인</button>
    <button><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>카테고리</button>
    <button><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>메뉴</button>
  </nav>

  <script>
    const heroSlides = [
      { title: "한미 정상회담 후속 조치 로드맵 발표", meta: "외교 · 거론 1,240회", img: "https://images.unsplash.com/photo-1541872703-74c5e44368f9?auto=format&fit=crop&w=1400&q=80" },
      { title: "반도체 수출 호조, AI 수요가 견인", meta: "경제·IT · 거론 980회", img: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1400&q=80" },
      { title: "국회 예산안 처리 본격화", meta: "정치 · 거론 860회", img: "https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=1400&q=80" }
    ];

    const ranks = [
      { rank:1, title:"한미 정상회담 후속", count:"1,240회", img:"https://images.unsplash.com/photo-1541872703-74c5e44368f9?auto=format&fit=crop&w=500&q=80" },
      { rank:2, title:"반도체 수출 호조", count:"980회", img:"https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=500&q=80" },
      { rank:3, title:"기준금리 동결 전망", count:"720회", img:"https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=500&q=80" },
      { rank:4, title:"AI 기본법 시행 준비", count:"650회", img:"https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=500&q=80" },
      { rank:5, title:"부동산 규제 완화 검토", count:"540회", img:"https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=500&q=80" }
    ];

    const entities = {
      featured: { name:"윤석열 대통령", desc:"한미 정상회담 후속 조치와 외교 일정 중심으로 최근 뉴스에서 가장 높은 빈도로 등장.", tags:["외교","정치","인물"], img:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=800&q=80" },
      list: [
        { name:"이재용 회장", desc:"반도체 투자·수출 관련 발언 주목", tags:["경제","IT"], img:"https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=200&q=80" },
        { name:"AI 기본법", desc:"시행 준비 본격화, 산업계 반응 이어짐", tags:["사건","IT"], img:"https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=200&q=80" },
        { name:"캠프 데이비드", desc:"한미일 정상회담 장소로 재조명", tags:["장소","외교"], img:"https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=200&q=80" }
      ]
    };

    const themes = [
      { title:"정치 · 예산안 처리", desc:"여야 협상 재개와 민생 예산 비중 논의", img:"https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=200&q=80" },
      { title:"경제 · 금리 동결 전망", desc:"물가 안정세 지속, 가계부채 관리 병행", img:"https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=200&q=80" },
      { title:"IT · 반도체 수출", desc:"AI 수요 확대에 힘입은 고대역폭 메모리 성장", img:"https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=200&q=80" },
      { title:"외교 · 한미 후속 조치", desc:"안보·경제 협력 로드맵 공개", img:"https://images.unsplash.com/photo-1541872703-74c5e44368f9?auto=format&fit=crop&w=200&q=80" }
    ];

    const hero = document.getElementById('hero');
    heroSlides.forEach((s,i) => {
      const div = document.createElement('div');
      div.className = 'slide' + (i===0?' active':'');
      div.style.backgroundImage = `url('${s.img}')`;
      div.innerHTML = `<div class="slide-content"><h2>${s.title}</h2><div class="meta">${s.meta}</div></div>`;
      hero.appendChild(div);
    });
    let cur=0;
    setInterval(()=>{
      document.querySelectorAll('.slide')[cur].classList.remove('active');
      cur = (cur+1)%heroSlides.length;
      document.querySelectorAll('.slide')[cur].classList.add('active');
    }, 5500);

    document.getElementById('rank-list').innerHTML = ranks.map(r=>`
      <div class="rank-item">
        <div class="rank-num">${r.rank}</div>
        <div class="rank-thumb" style="background-image:url('${r.img}')">
          <div class="rank-info"><h3>${r.title}</h3><div class="rank-count">거론 ${r.count}</div></div>
        </div>
      </div>`).join('');

    document.getElementById('entities').innerHTML = `
      <div class="featured">
        <div class="img" style="background-image:url('${entities.featured.img}')"></div>
        <div class="featured-body">
          <h3>${entities.featured.name}</h3>
          <p style="font-size:14px;color:var(--gray);margin-bottom:8px;">${entities.featured.desc}</p>
          <div class="entity-tags">${entities.featured.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        </div>
      </div>
      <div class="compact-list">
        ${entities.list.map(e=>`
          <div class="compact-item">
            <div class="thumb" style="background-image:url('${e.img}')"></div>
            <div>
              <h4>${e.name}</h4>
              <p style="font-size:13px;color:var(--gray);">${e.desc}</p>
              <div class="entity-tags">${e.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
            </div>
          </div>`).join('')}
      </div>`;

    document.getElementById('themes').innerHTML = themes.map(t=>`
      <div class="compact-item">
        <div class="thumb" style="background-image:url('${t.img}')"></div>
        <div>
          <h4>${t.title}</h4>
          <p style="font-size:13px;color:var(--gray);">${t.desc}</p>
        </div>
      </div>`).join('');

    /*
    // Live RSS via Cloudflare Worker (deploy worker.js first)

      try {
        const worker = 'https://YOUR-WORKER.workers.dev/?feed=';
        const res = await fetch(worker + encodeURIComponent('https://www.yna.co.kr/rss/politics.xml'));
        if (!res.ok) throw new Error();
        // parse XML and update UI...
      } catch(e) { console.log('Using sample data'); }
    }
    */
  </script>
</body>
</html>
