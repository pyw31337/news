<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>렛츠뉴스</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --orange: #FF6B00;
      --navy: #1A2332;
      --cream: #FAF7F2;
      --gray: #5A6570;
      --card: #fff;
      --shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', system-ui, sans-serif; background: var(--cream); color: var(--navy); padding-bottom: 80px; }
    a { text-decoration: none; color: inherit; }

    header {
      background: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100;
    }
    .logo { font-weight: 800; font-size: 22px; color: var(--orange); }
    .logo span { color: var(--navy); }
    .tagline { font-size: 12px; color: var(--gray); margin-left: 8px; font-weight: 500; }
    .header-actions { display: flex; gap: 12px; font-size: 14px; font-weight: 600; color: var(--gray); }

    .hero-slider { position: relative; height: 420px; overflow: hidden; }
    .slide {
      position: absolute; inset: 0; background-size: cover; background-position: center;
      display: flex; align-items: flex-end; color: #fff; opacity: 0; transition: opacity 0.6s;
    }
    .slide.active { opacity: 1; }
    .slide::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0.1)); }
    .slide-content { position: relative; padding: 24px 16px 32px; max-width: 1100px; margin: 0 auto; width: 100%; }
    .slide h2 { font-size: clamp(22px, 6vw, 36px); font-weight: 800; line-height: 1.3; margin-bottom: 8px; }
    .slide .meta { font-size: 13px; opacity: 0.9; }
    .dots { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 2; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); }
    .dot.active { background: #fff; }

    section { padding: 28px 16px; max-width: 1100px; margin: 0 auto; }
    h2.sec { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .sec-sub { font-size: 13px; color: var(--gray); margin-bottom: 16px; }

    .rank-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
    .rank-item { flex: 0 0 160px; scroll-snap-align: start; position: relative; }
    .rank-num {
      position: absolute; left: -8px; top: 40%; transform: translateY(-50%);
      font-size: 72px; font-weight: 900; color: rgba(255,255,255,0.9);
      text-shadow: 2px 2px 8px rgba(0,0,0,0.4); z-index: 2; pointer-events: none;
    }
    .rank-thumb {
      height: 220px; border-radius: 12px; background-size: cover; background-position: center;
      position: relative; overflow: hidden; box-shadow: var(--shadow);
    }
    .rank-thumb::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent 50%); }
    .rank-info { position: absolute; bottom: 12px; left: 12px; right: 12px; color: #fff; z-index: 1; }
    .rank-info h3 { font-size: 14px; font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
    .rank-count { font-size: 12px; opacity: 0.9; }

    .entity-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 640px) { .entity-grid { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 960px) { .entity-grid { grid-template-columns: 1fr 1fr 1fr; } }
    .entity-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
    .entity-img { height: 140px; background-size: cover; background-position: center; }
    .entity-body { padding: 14px; }
    .entity-body h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .entity-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .tag { font-size: 11px; background: #FFF3E8; color: var(--orange); padding: 3px 8px; border-radius: 10px; font-weight: 600; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee;
      display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); z-index: 100;
    }
    .bottom-nav button {
      background: none; border: none; font-family: inherit; display: flex; flex-direction: column;
      align-items: center; font-size: 11px; font-weight: 600; color: var(--gray); gap: 2px; cursor: pointer;
    }
    .bottom-nav button.active { color: var(--orange); }
    .bottom-nav svg { width: 22px; height: 22px; }

    @media (min-width: 768px) { .bottom-nav { display: none; } .hero-slider { height: 520px; } }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:baseline;">
      <div class="logo">렛츠<span>뉴스</span></div>
      <div class="tagline">오늘의 이슈를 따라가다</div>
    </div>
    <div class="header-actions">
      <span>검색</span>
      <span>메뉴</span>
    </div>
  </header>

  <div class="hero-slider" id="hero">
    <div class="dots" id="dots"></div>
  </div>

  <section>
    <h2 class="sec">오늘 가장 많이 회자된 뉴스</h2>
    <p class="sec-sub">넷플릭스 순위처럼 거론 횟수 기준</p>
    <div class="rank-scroll" id="rank-list"></div>
  </section>

  <section style="background:#fff;border-radius:20px 20px 0 0;">
    <h2 class="sec">지금 핫한 인물</h2>
    <p class="sec-sub">최근 뉴스에서 자주 등장하는 인물과 관련 흐름</p>
    <div class="entity-grid" id="people"></div>
  </section>

  <section>
    <h2 class="sec">핫한 장소 · 사건</h2>
    <p class="sec-sub">장소와 사건을 중심으로 이어지는 타임라인</p>
    <div class="entity-grid" id="places-events"></div>
  </section>

  <section style="background:#fff;">
    <h2 class="sec">테마별 이슈</h2>
    <p class="sec-sub">정치 · 경제 · IT · 외교</p>
    <div class="entity-grid" id="themes"></div>
  </section>

  <nav class="bottom-nav">
    <button class="active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>오늘
    </button>
    <button>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>타임라인
    </button>
    <button>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>카테고리
    </button>
    <button>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>메뉴
    </button>
  </nav>

  <script>
    const heroSlides = [
      { title: "한미 정상회담 후속 조치 로드맵 발표", meta: "외교 · 거론 1,240회", img: "https://images.unsplash.com/photo-1541872703-74c5e44368f9?auto=format&fit=crop&w=1400&q=80" },
      { title: "반도체 수출 호조, AI 수요가 견인", meta: "경제·IT · 거론 980회", img: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1400&q=80" },
      { title: "국회 예산안 처리 본격화", meta: "정치 · 거론 860회", img: "https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=1400&q=80" }
    ];

    const ranks = [
      { rank: 1, title: "한미 정상회담 후속", count: "1,240회", img: "https://images.unsplash.com/photo-1541872703-74c5e44368f9?auto=format&fit=crop&w=400&q=80" },
      { rank: 2, title: "반도체 수출 호조", count: "980회", img: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=400&q=80" },
      { rank: 3, title: "기준금리 동결 전망", count: "720회", img: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=400&q=80" },
      { rank: 4, title: "AI 기본법 시행 준비", count: "650회", img: "https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=400&q=80" },
      { rank: 5, title: "부동산 규제 완화 검토", count: "540회", img: "https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=400&q=80" }
    ];

    const people = [
      { name: "윤석열 대통령", desc: "한미 정상회담 후속 조치 주도", tags: ["외교","정치"], img: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=400&q=80" },
      { name: "이재용 회장", desc: "반도체 투자·수출 관련 발언 주목", tags: ["경제","IT"], img: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=400&q=80" },
      { name: "최상목 부총리", desc: "경제 정책·금리 관련 발언", tags: ["경제"], img: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=400&q=80" }
    ];

    const placesEvents = [
      { name: "캠프 데이비드", desc: "한미일 정상회담 장소로 재조명", tags: ["외교","장소"], img: "https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=400&q=80" },
      { name: "AI 기본법", desc: "시행 준비 본격화, 산업계 반응", tags: ["사건","IT"], img: "https://images.unsplash.com/photo-1518709268805-4e9042af2176?auto=format&fit=crop&w=400&q=80" },
      { name: "국회", desc: "예산안 처리 일정과 쟁점", tags: ["정치","장소"], img: "https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=400&q=80" }
    ];

    const themes = [
      { title: "정치 · 예산안", desc: "여야 협상 재개와 민생 예산 비중", img: "https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=400&q=80" },
      { title: "경제 · 금리", desc: "동결 전망과 가계부채 관리", img: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=400&q=80" },
      { title: "IT · 반도체", desc: "AI 수요 확대에 따른 수출 호조", img: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=400&q=80" }
    ];

    const hero = document.getElementById('hero');
    const dots = document.getElementById('dots');
    heroSlides.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'slide' + (i === 0 ? ' active' : '');
      div.style.backgroundImage = `url('${s.img}')`;
      div.innerHTML = `<div class="slide-content"><h2>${s.title}</h2><div class="meta">${s.meta}</div></div>`;
      hero.appendChild(div);
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      dots.appendChild(d);
    });
    let current = 0;
    setInterval(() => {
      document.querySelectorAll('.slide')[current].classList.remove('active');
      document.querySelectorAll('.dot')[current].classList.remove('active');
      current = (current + 1) % heroSlides.length;
      document.querySelectorAll('.slide')[current].classList.add('active');
      document.querySelectorAll('.dot')[current].classList.add('active');
    }, 5000);

    document.getElementById('rank-list').innerHTML = ranks.map(r => `
      <div class="rank-item">
        <div class="rank-num">${r.rank}</div>
        <div class="rank-thumb" style="background-image:url('${r.img}')">
          <div class="rank-info">
            <h3>${r.title}</h3>
            <div class="rank-count">거론 ${r.count}</div>
          </div>
        </div>
      </div>
    `).join('');

    document.getElementById('people').innerHTML = people.map(p => `
      <div class="entity-card">
        <div class="entity-img" style="background-image:url('${p.img}')"></div>
        <div class="entity-body">
          <h3>${p.name}</h3>
          <p style="font-size:13px;color:var(--gray);">${p.desc}</p>
          <div class="entity-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        </div>
      </div>
    `).join('');

    document.getElementById('places-events').innerHTML = placesEvents.map(p => `
      <div class="entity-card">
        <div class="entity-img" style="background-image:url('${p.img}')"></div>
        <div class="entity-body">
          <h3>${p.name}</h3>
          <p style="font-size:13px;color:var(--gray);">${p.desc}</p>
          <div class="entity-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        </div>
      </div>
    `).join('');

    document.getElementById('themes').innerHTML = themes.map(t => `
      <div class="entity-card">
        <div class="entity-img" style="background-image:url('${t.img}')"></div>
        <div class="entity-body">
          <h3>${t.title}</h3>
          <p style="font-size:13px;color:var(--gray);">${t.desc}</p>
        </div>
      </div>
    `).join('');
  </script>
</body>
</html>
