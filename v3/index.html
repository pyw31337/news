<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#fbfbfa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NewsBoard">
  <meta property="og:title" content="NewsBoard v3 · 인텔리전스 인포데스크">
  <meta property="og:description" content="10대 핵심 어젠다, 거시 경제 펄스, 글로벌 외신 AI 해설, 인물 지식 관계망을 종합한 심층 뉴스 정보 상황판">
  <title>NewsBoard v3 · 인텔리전스 인포데스크</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://pyw31337.github.io/lets/css/lets-design-system.css?v=1.1.0">
  <link rel="stylesheet" href="v3-home.css?v=1.0.0">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-head">
    <div class="head-in">
      <a class="brand" href="./">
        NewsBoard<i>.</i><span class="v-tag">v3</span>
      </a>
      <nav class="main-nav" aria-label="주요 메뉴">
        <a class="is-on" href="./">인포데스크</a>
        <a href="#agendaSection">10대 어젠다</a>
        <a href="#globalSection">글로벌 뷰</a>
        <a href="#peopleSection">인물 관계망</a>
        <a href="#labSection">시사 랩</a>
        <a href="../v2/" style="color:var(--faint);">v2 레거시</a>
      </nav>
      <div class="head-tools">
        <button class="search-trigger" id="searchTrigger" aria-label="이슈·인물 빠른 검색">
          <span>⌕ 빠른 탐색</span>
          <kbd>/</kbd>
        </button>
      </div>
    </div>
  </header>

  <!-- Layer 1: Macro Pulse & Briefing Bar -->
  <aside class="macro-pulse" id="macroTicker">
    <div class="macro-in">
      <span class="macro-label">MACRO PULSE</span>
      <span style="color:var(--muted); font-size:12px;">시장 지표 불러오는 중…</span>
    </div>
  </aside>

  <!-- Main Multi-Layer Content -->
  <main class="wrap page" id="app">
    <!-- Layer 2: 10-Agenda Deck -->
    <section class="section" id="agendaSection">
      <p style="padding:60px 0; text-align:center; color:var(--muted);">10대 핵심 어젠다를 구성하는 중…</p>
    </section>

    <!-- Layer 3: Global View -->
    <section class="section" id="globalSection"></section>

    <!-- Layer 4: People & Ontology Radar -->
    <section class="section" id="peopleSection"></section>

    <!-- Layer 5: Intelligence Lab & Daily Quiz -->
    <section class="section" id="labSection"></section>
  </main>

  <!-- Search Palette Modal -->
  <div class="modal-overlay" id="searchModal" role="dialog" aria-modal="true" aria-label="빠른 검색 팔레트">
    <div class="search-dialog">
      <div class="search-input-wrap">
        <span style="font-size:18px; color:var(--muted); margin-right:12px;">⌕</span>
        <input type="text" id="modalSearchInput" placeholder="이슈, 인물, 기관, 키워드 검색…" autocomplete="off">
        <button id="closeSearchBtn" style="padding:4px 8px; font-size:12px; color:var(--muted); font-weight:700;">ESC</button>
      </div>
      <div class="search-results-list" id="modalSearchResults"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer" style="border-top:1px solid var(--line); padding:40px 0; background:var(--surface);">
    <div class="wrap" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
      <div>
        <strong style="font-size:14px; letter-spacing:-0.03em;">NewsBoard v3 Intelligence Info-Desk</strong>
        <p style="margin:4px 0 0; color:var(--muted); font-size:12px;">
          실제 수집 원장·진실 계약 기반 · 단일 프레임워크 없는 경량 네이티브 렌더링
        </p>
      </div>
      <div style="font-size:12px; color:var(--muted); display:flex; gap:16px;">
        <a href="../" style="text-decoration:underline;">v1 홈</a>
        <a href="../v2/" style="text-decoration:underline;">v2 메인</a>
        <a href="https://pyw31337.github.io/lets/" target="_blank" rel="noopener">통합 관제 허브 ↗</a>
      </div>
    </div>
  </footer>

  <script src="v3-home.js?v=1.0.0"></script>
</body>
</html>
