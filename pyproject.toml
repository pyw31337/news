[project]
name = "newsboard-pipeline"
version = "1.0.0"
description = "NewsBoard Automated News Collection and Analysis Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "pyw31337" }
]
dependencies = [
    "kiwipiepy>=0.17.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "pdfplumber>=0.11.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0"
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "data",
    "media",
    "politicians",
    "history",
    "legal"
]
