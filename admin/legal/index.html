<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>법조인 판결 기록 (비공개 시안)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#0f1630;--sub:#5b6478;--line:#e6e8ef;--bg:#f6f7fb;--in:#2f6bff;--lo:#18a957;--hi:#e5484d}
*{box-sizing:border-box}body{margin:0;font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.banner{background:#fff4e5;border:1px solid #ffd8a8;color:#8a4b00;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600}
h1{font-size:26px;font-weight:800;margin:18px 0 4px}h2{font-size:18px;font-weight:800;margin:28px 0 10px}
.muted{color:var(--sub);font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi b{display:block;font-size:24px;font-weight:800}.kpi span{font-size:12px;color:var(--sub)}
.judges{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:14px}.chip.on{background:var(--ink);color:#fff}
.tl{position:relative;padding-left:22px}.tl:before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ev{position:relative;margin-bottom:14px}.ev:before{content:"";position:absolute;left:-20px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--in);box-shadow:0 0 0 3px #fff}
.ev .d{font-size:12px;color:var(--sub);font-weight:600}.ev .m{font-weight:700}.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:#eef2ff;color:#3a4dbf;margin-right:4px}
.row{display:grid;grid-template-columns:130px 1fr 60px;align-items:center;gap:10px;margin:10px 0;font-size:13px}
.bar{position:relative;height:26px;background:#f0f1f5;border-radius:8px}.band{position:absolute;top:0;bottom:0;border-radius:8px}
.dot{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid #fff}
.legend span{display:inline-flex;align-items:center;gap:4px;margin-right:12px;font-size:12px;color:var(--sub)}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.note{font-size:12px;color:var(--sub);background:#f3f4f8;border-radius:10px;padding:10px 12px;line-height:1.6}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:90px 1fr 44px}}
</head><body><div class="wrap">
<div class="banner">비공개 시안이에요. 공개 페이지와 연결되어 있지 않고, 법적 검토가 끝나기 전에는 공개하지 않아요.</div>
<h1>법조인 판결 기록</h1><p class="muted">수집된 뉴스의 판결 보도에서 자동 추출했어요. 사건 당사자 이름은 저장하지 않아요. 보도를 기반으로 추출해서 오류가 있을 수 있어요.</p>
<div class="kpis" id="kpis"></div>
<h2>판사별 타임라인</h2><div class="card"><div class="judges" id="judges"></div><div class="tl" id="tl" style="margin-top:16px"></div></div>
<h2>양형기준 대비 선고 위치</h2>
<div class="card"><div class="legend"><span><i style="background:#dfe7ff"></i>기준 권고 범위(기본 영역)</span><span><i style="background:var(--lo)"></i>범위 아래</span><span><i style="background:var(--in)"></i>범위 안</span><span><i style="background:var(--hi)"></i>범위 위</span><span><i style="background:#aab"></i>집행유예</span></div><div id="chart"></div>
<p class="note">이 차트는 "관대하다" 또는 "엄격하다"를 판정하지 않아요. 양형기준은 권고 기준이고, 합의, 전과, 여러 범죄를 함께 처벌하는 경합범, 감경 사유는 기사만으로 모두 알 수 없어요. 1심 형량은 항소심에서 바뀔 수 있어요. 기준 범위는 양형위원회 양형기준의 기본 영역이에요(행 오른쪽 건수를 누르면 원문). 기사로 유형(피해액, 사망 여부 등)을 특정할 수 있을 때만 점을 찍고, 살인처럼 동기 유형을 알 수 없는 사건은 찍지 않아요. 같은 범죄 유형이 3건 미만인 판사는 비교하지 않아요.</p></div>
<p class="muted">정정이나 삭제를 요청할 창구는 공개 전에 마련해야 해요. 출처: 각 언론 보도, 국가법령정보센터, 양형위원회.</p>
</div><script src="legal.js?v=3"></script></body></html>
