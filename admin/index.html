<body>
<header class="top"><a class="brand" href="../"><b>News</b>Board<i>.</i></a><span class="tag">관리자</span><button id="lockbtn" class="ghost" hidden>잠그기</button></header>
<main id="app"><section class="lock card" id="lock">

  <p class="err" id="lerr" role="alert"></p>
  <p class="fine">이 잠금은 브라우저 안에서만 확인하는 간단한 잠금이에요. 여기 보이는 정보는 모두 공개 데이터예요.</p>
</section></main>
