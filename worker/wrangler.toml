name = "newsboard-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
SITE = "https://pyw31337.github.io/news/"
ORIGINS = "https://pyw31337.github.io,http://localhost:8765"

[[d1_databases]]
binding = "DB"
database_name = "newsboard-sync"
database_id = "6b5af540-0caf-4aed-8d3a-656ec979a2ca"

[[r2_buckets]]
binding = "BK"
bucket_name = "newsboard-backup"

# 매일 04:10 KST(19:10 UTC) D1 전체를 R2로 내보내기(30일 보관). D1 자체 Time Travel(무료 7일)과 함께 이중 온라인 백업
[triggers]
crons = ["10 19 * * *"]
# 비밀값(wrangler secret put): ID_SALT(필수), GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET, KAKAO_REST_KEY/KAKAO_CLIENT_SECRET(선택)
