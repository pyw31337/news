name = "newsboard-sync"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
SITE = "https://pyw31337.github.io/news/"
ORIGINS = "https://pyw31337.github.io,http://localhost:8765"

[[d1_databases]]
binding = "DB"
database_name = "newsboard-sync"
database_id = "6b5af540-0caf-4aed-8d3a-656ec979a2ca"

[[r2_buckets]]
binding = "BK"
bucket_name = "newsboard-backup"

# 매일 04:10 KST(19:10 UTC) D1 전체를 R2로 내보내기(30일 보관). D1 자체 Time Travel(무료 7일)과 함께 이중 온라인 백업
[triggers]
crons = ["10 19 * * *"]
# 비밀값(wrangler secret put): ID_SALT(필수), GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET,
# KAKAO_REST_KEY/KAKAO_CLIENT_SECRET, NAVER_CLIENT_ID/NAVER_CLIENT_SECRET(선택)

# 인물 아카이브(타임라인·관계 그래프). 사용자 동기화 DB와 분리
[[d1_databases]]
binding = "AR"
database_name = "newsboard-archive"
database_id = "f200e94d-5b22-47bc-8868-ad42cb929bc0"
# 비밀값 ARCHIVE_KEY: 수집기(GitHub Actions)만 쓰기 가능
