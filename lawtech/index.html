<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>렛츠로 (Let’s Law) · 독립 AI 법률 인텔리전스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f8fafc;--card:#ffffff;--text:#0f172a;--mute:#64748b;--primary:#1e3a8a;--blue:#2563eb;--line:#e2e8f0;--ok:#10b981;--warn:#f59e0b;--err:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Pretendard Variable",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:3rem}
.wrap{max-width:1120px;margin:0 auto;padding:0 1rem}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.top-nav{display:flex;justify-content:space-between;align-items:center;height:60px}
.brand{font-size:1.2rem;font-weight:800;color:var(--primary);text-decoration:none;display:flex;align-items:center;gap:6px}
.brand span{color:var(--blue)}
.pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:.7rem;font-weight:600}
.pill-ok{background:#dcfce7;color:#15803d}
.pill-blue{background:#eff6ff;color:#1d4ed8}
.hero{background:linear-gradient(135deg,#1e3a8a 0%,#1e40af 100%);color:#fff;padding:2.5rem 0;margin-bottom:1.5rem}
.hero h1{font-size:1.8rem;margin-bottom:.5rem;font-weight:800}
.hero p{font-size:.9rem;color:#bfdbfe;max-width:720px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1rem;margin-bottom:1.5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.25rem;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.card h2{font-size:1.05rem;font-weight:700;margin-bottom:.75rem;color:var(--primary);display:flex;align-items:center;gap:6px}
.sim-box{display:grid;gap:.75rem}
.form-grp{display:flex;flex-direction:column;gap:4px}
.form-grp label{font-size:.78rem;font-weight:600;color:var(--mute)}
select,input{padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:.85rem;background:#fff}
.check-grp{display:grid;gap:6px;margin-top:6px}
.chk-item{display:flex;align-items:center;gap:6px;font-size:.8rem}
.stat-box{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.stat-row{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:6px}
.badge-rate{font-size:1.1rem;font-weight:800}
.precedent-list{display:grid;gap:.75rem}
.prec-card{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.prec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.back-link{font-size:.78rem;color:var(--mute);text-decoration:none}
.back-link:hover{color:var(--blue)}
</style>
</head>
<body>
<header>
  <div class="wrap top-nav">
    <a href="./" class="brand">⚖️ 렛츠로 <span>Let’s Law</span> <span class="pill pill-ok">독립 서비스 v1</span></a>
    <div>
      <a href="../" class="back-link">← 뉴스보드 코어로 이동</a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <span class="pill pill-blue" style="background:#2563eb;color:#fff;margin-bottom:8px">대법원 양형위원회 양형기준 연동</span>
    <h1>판례 중심 맞춤형 형량 분석 & 법률 인텔리전스</h1>
    <p>공직선거법, 횡령·배임, 자본시장법 등 15대 리딩 판례와 대법원 양형위원회의 감경·가중 인자를 결합하여 집행유예율 및 의원직·임원직 결격 위험도를 즉각 시뮬레이션합니다.</p>
  </div>
</section>

<main class="wrap">
  <div class="grid2">
    <!-- 양형 시뮬레이터 -->
    <div class="card">
      <h2>📊 대법원 양형기준 가중치 시뮬레이터</h2>
      <div class="sim-box">
        <div class="form-grp">
          <label>혐의 / 죄목 선택</label>
          <select id="crime-select">
            <option value="election_false">공직선거법 허위사실공표죄 (제250조)</option>
            <option value="bribery">특정범죄 가중처벌법상 뇌물수수 (3천만~5천만 원)</option>
            <option value="embezzle">특정경제범죄법상 횡령·배임 (5억~50억 원)</option>
          </select>
        </div>

        <div>
          <label style="font-size:.78rem;font-weight:600;color:#15803d">🟢 특별 감경 인자 (다중 선택)</label>
          <div class="check-grp" id="miti-box"></div>
        </div>

        <div>
          <label style="font-size:.78rem;font-weight:600;color:#b91c1c">🔴 특별 가중 인자 (다중 선택)</label>
          <div class="check-grp" id="agg-box"></div>
        </div>

        <div class="stat-box" id="result-box"></div>
      </div>
    </div>

    <!-- 15대 리딩 판례 데이터베이스 -->
    <div class="card">
      <h2>🏛️ 핵심 리딩 판례 데이터베이스 (15대 판례)</h2>
      <div class="form-grp" style="margin-bottom:10px">
        <input type="text" id="prec-search" placeholder="판례 번호, 혐의, 주요 쟁점 검색...">
      </div>
      <div class="precedent-list" id="prec-list">
        <p style="color:var(--mute);font-size:.85rem">판례 데이터를 로드하고 있습니다...</p>
      </div>
    </div>
  </div>
</main>

<script>
const LEGAL_MODELS = {
  election_false: {
    name: '공직선거법 허위사실공표죄 (제250조)',
    base_range: '징역 6개월 ~ 1년 4개월 또는 벌금 500만~1,000만 원',
    miti_range: '징역 1개월 ~ 8개월 또는 벌금 200만~500만 원',
    agg_range: '징역 10개월 ~ 2년',
    miti_list: ['진지한 반성 및 재발 방지 다짐', '초범 또는 동종 전과 없음', '위법성 인식 결여에 정당한 사유 참작'],
    agg_list: ['전파성 높은 대중 매체(방송·SNS) 이용', '계획적·조직적 허위사실 유포', '선거 결과에 중대한 영향을 미침'],
    prob: {miti: 78.5, base: 52.1, agg: 14.2},
    loss: {miti: 45.0, base: 68.2, agg: 92.4}
  },
  bribery: {
    name: '특정범죄 가중처벌법상 뇌물수수죄 (3천만~5천만 원)',
    base_range: '징역 3년 ~ 5년',
    miti_range: '징역 2년 ~ 3년',
    agg_range: '징역 4년 ~ 6년',
    miti_list: ['수동적·소극적 수수', '진지한 반성 및 수수 금품 전액 반환', '수사기관에 적극 협조 및 자수'],
    agg_list: ['직무 권한 남용 및 부정한 직무 집행', '적극적인 뇌물 요구', '공직 사회 신뢰에 중대한 훼손 초래'],
    prob: {miti: 55.0, base: 28.4, agg: 5.1},
    loss: {miti: 88.0, base: 98.5, agg: 100.0}
  },
  embezzle: {
    name: '특정경제범죄 가중처벌법상 횡령·배임 (5억~50억 원)',
    base_range: '징역 3년 ~ 7년',
    miti_range: '징역 1년 6개월 ~ 3년',
    agg_range: '징역 4년 ~ 8년',
    miti_list: ['피해액 상당 부분 회복 및 공탁', '경영상 판단의 한계 참작', '회사 설립 기여도 및 반성'],
    agg_list: ['개인적 치부 및 유흥 유용', '조직적 분식회계 동반', '회사 부도 및 주주 피해 극심'],
    prob: {miti: 62.0, base: 31.5, agg: 8.4},
    loss: {miti: 75.0, base: 92.0, agg: 100.0}
  }
};

let curCrime = 'election_false';
let curMiti = new Set([0, 1]);
let curAgg = new Set([0]);

function renderSim() {
  const model = LEGAL_MODELS[curCrime];
  const mBox = document.getElementById('miti-box');
  const aBox = document.getElementById('agg-box');
  
  mBox.innerHTML = model.miti_list.map((m, i) => `
    <label class="chk-item">
      <input type="checkbox" onchange="toggleMiti(${i})" ${curMiti.has(i)?'checked':''}>
      <span>${m}</span>
    </label>
  `).join('');

  aBox.innerHTML = model.agg_list.map((a, i) => `
    <label class="chk-item">
      <input type="checkbox" onchange="toggleAgg(${i})" ${curAgg.has(i)?'checked':''}>
      <span>${a}</span>
    </label>
  `).join('');

  const mCount = curMiti.size;
  const aCount = curAgg.size;
  let zone = '기본 영역';
  let range = model.base_range;
  let probVal = model.prob.base;
  let lossVal = model.loss.base;

  if (mCount > aCount) {
    zone = '특별 감경 영역';
    range = model.miti_range;
    probVal = model.prob.miti;
    lossVal = model.loss.miti;
  } else if (aCount > mCount) {
    zone = '특별 가중 영역';
    range = model.agg_range;
    probVal = model.prob.agg;
    lossVal = model.loss.agg;
  }

  const rBox = document.getElementById('result-box');
  rBox.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <b style="font-size:.85rem;color:#1e3a8a">판정 영역: <span style="color:#2563eb">${zone}</span></b>
      <span class="pill pill-ok">양형기준 권고형량</span>
    </div>
    <div style="font-size:.9rem;font-weight:700;color:#0f172a;margin-bottom:8px">${range}</div>
    <div class="stat-row">
      <span>집행유예 선고 확률</span>
      <b class="badge-rate" style="color:${probVal>=50?'#15803d':'#b91c1c'}">${probVal}%</b>
    </div>
    <div class="stat-row">
      <span>직위 상실(의원직/임원결격) 위험도</span>
      <b class="badge-rate" style="color:${lossVal>=60?'#b91c1c':'#15803d'}">${lossVal}%</b>
    </div>
  `;
}

function toggleMiti(idx) {
  curMiti.has(idx) ? curMiti.delete(idx) : curMiti.add(idx);
  renderSim();
}
function toggleAgg(idx) {
  curAgg.has(idx) ? curAgg.delete(idx) : curAgg.add(idx);
  renderSim();
}

document.getElementById('crime-select').onchange = e => {
  curCrime = e.target.value;
  curMiti.clear(); curAgg.clear();
  curMiti.add(0); curAgg.add(0);
  renderSim();
};

async function loadPrecedents() {
  try {
    const res = await fetch('../data/lawtech/precedents_db.json');
    const data = await res.json();
    const list = data.precedents || [];
    renderPrecedents(list);
    
    document.getElementById('prec-search').oninput = e => {
      const q = e.target.value.toLowerCase();
      const filtered = list.filter(p => ((p.case_no||'') + (p.case_name||'') + (p.category||'') + (p.crime_type||'') + (p.summary||'') + (p.key_takeaway||'')).toLowerCase().includes(q));
      renderPrecedents(filtered);
    };
  } catch (err) {
    document.getElementById('prec-list').innerHTML = '<p style="color:#ef4444;font-size:.85rem">판례 데이터를 로드할 수 없습니다.</p>';
  }
}

function renderPrecedents(list) {
  const pList = document.getElementById('prec-list');
  if (!list.length) {
    pList.innerHTML = '<p style="color:var(--mute);font-size:.85rem">일치하는 판례가 없습니다.</p>';
    return;
  }
  pList.innerHTML = list.map(p => `
    <div class="prec-card">
      <div class="prec-h">
        <b style="font-size:.84rem;color:#0f172a">${p.case_name}</b>
        <span class="pill pill-blue">${p.category || '형사범죄'}</span>
      </div>
      <div style="font-size:.74rem;color:var(--mute);margin-bottom:4px">선고번호: <b>${p.case_no}</b> (${p.court}) · ${p.date || ''}</div>
      <div style="font-size:.76rem;color:#1e40af;margin-bottom:4px">선고형: <b>${p.verdict?.sentence || p.sentence || '실형/집행유예'}</b></div>
      <p style="font-size:.74rem;color:#475569;line-height:1.4">${p.summary || p.key_takeaway || ''}</p>
    </div>
  `).join('');
}

renderSim();
loadPrecedents();
</script>
</body>
</html>
