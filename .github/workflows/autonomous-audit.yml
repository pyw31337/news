name: autonomous-public-audit

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 공개 산출물 계약 점검
        run: python3 scripts/public_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-audit
          path: reports/public-audit.json
          retention-days: 30
