name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
      - uses: actions/checkout@v4
        with:
          ref: media
          path: _media
      - uses: actions/checkout@v4
        with:
          ref: politicians
          path: _pol
      - name: Prepare Pages artifact
        run: |
          mkdir _site
          cp -r index.html assets icons admin manifest.webmanifest sw.js og-image.png favicon.ico _site/
          mkdir _site/data
          cp -r _data/today.json _data/archive _site/data/
          cp _data/global.json _data/status.json _data/briefs.json _data/official.json _data/ecos_series.json _data/voice.json _data/fun.json _site/data/ 2>/dev/null || true
          cp -r _data/gov _site/data/ 2>/dev/null || true
          mkdir -p _site/media
          cp -r _media/img _site/media/ 2>/dev/null || true
          python3 scripts/build_pages.py _site
          cp -r politicians persons history games privacy terms login _site/
          mkdir -p _site/data/pol
          cp -r _pol/index.json _pol/people _site/data/pol/
          cp -r _pol/photos _site/data/pol/ 2>/dev/null || true
          cp _pol/feed.json _site/data/pol/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
