name: Deploy current site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install Pillow
      # collect.yml '사이트 묶기'와 같은 구성. 수집은 다시 하지 않고,
      # 커밋되지 않는 today·global·status는 지금 공개된 사이트에서, 나머지는 data·media·politicians 브랜치에서 가져옴
      - name: Prepare site with the currently published data
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          repo="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch data "$repo" data
          git clone -q --depth 1 --branch media "$repo" media || mkdir media
          base=https://pyw31337.github.io/news/data
          curl -fsSL --retry 3 "$base/today.json" -o data/today.json
          python scripts/sanitize_today.py data/today.json
          # 기존에 게시된 데이터도 같은 사진 출처·동명이인 규칙으로 재검사한다.
          # 검증되지 않은 사진은 배포 중단 대신 이니셜 표기로 안전하게 대체한다.
          python scripts/portrait_audit.py data/today.json --entity-media data/entity_media.json --asset-dir assets/people --output data/portrait_audit.json --sanitize
          for f in global.json status.json; do curl -fsSL --retry 3 "$base/$f" -o "data/$f" || true; done
          # data 브랜치의 fun.json이 수집 직전 판본일 수 있으므로, 방금 받은 today.json으로
          # 학습 콘텐츠를 다시 조립한다. 외부 LLM 호출은 하지 않아 배포가 데이터 수집을 막지 않는다.
          # 학습 보조 콘텐츠는 검수된 기존 판본을 안전판으로 둔다. 생성 실패가
          # 원본 기사·날씨·아카이브 배포 전체를 멈추게 해서는 안 된다.
          if ! FUN_DATA=data FUN_AI_SEC=0 python scripts/fun.py; then
            echo "::warning::Learning content build failed; keeping the last reviewed fun.json for this deployment."
          fi
          FUN_DATA=data python scripts/editorial_queue.py
          # 안전 폴백을 제공하는 정적 배포는 유지하면서, 편집 품질 이슈는 배포 로그에서 즉시 보이게 한다.
          FUN_DATA=data python scripts/editorial_queue.py --validate || echo "::warning::Editorial quality gate reported an issue; safe fallback content remains published."
          mkdir _site && cp -r index.html assets icons admin v2 manifest.webmanifest sw.js og-image.png favicon.ico _site/
          mkdir _site/data && cp -r data/today.json data/archive _site/data/ && (cp data/portrait_audit.json _site/data/ || true); (cp data/global.json data/status.json _site/data/ || true); (cp data/global_weather.json _site/data/ 2>/dev/null || true); (cp data/briefs.json _site/data/ 2>/dev/null || true); (cp data/official.json _site/data/ 2>/dev/null || true); (cp data/elite_network.json _site/data/ 2>/dev/null || true); (cp data/people_public.json _site/data/ 2>/dev/null || true); (mkdir -p _site/data/graph && cp -r data/db/people/graph/n data/db/people/graph/e _site/data/graph/ 2>/dev/null || true); (cp data/ecos_series.json _site/data/ 2>/dev/null || true); (cp data/stats.json data/stats_detail.json _site/data/ 2>/dev/null || cp data/stats.json _site/data/ 2>/dev/null || true); (cp data/market_detail.json _site/data/ 2>/dev/null || true); (cp -r data/gov _site/data/ 2>/dev/null || true); (cp data/voice.json _site/data/ 2>/dev/null || true); (cp data/quiz.json _site/data/ 2>/dev/null || true); (cp data/social.json _site/data/ 2>/dev/null || true); (cp data/fun.json _site/data/ 2>/dev/null && python scripts/fun_og.py _site || true); (cp -r data/fun _site/data/ 2>/dev/null || true); (cp -r data/editorial _site/data/ 2>/dev/null || true)
          # 사진은 R2(docs/DATA.md): R2에 올라간 것은 Worker 주소로 바꾸고, 아직 못 올린 것만 Pages에 실음
          (mkdir -p _site/media && cp -r media/img _site/media/ 2>/dev/null; cp -r media/ent _site/media/ 2>/dev/null || true)
          python scripts/media_r2.py rewrite _site media || true
          python scripts/build_pages.py _site
          python scripts/split_today.py _site || true
          python scripts/inject_cache_version.py _site || true
          cp -r politicians _site/ 2>/dev/null || true; cp -r persons _site/ 2>/dev/null || true; cp -r history _site/ 2>/dev/null || true; cp -r games _site/ 2>/dev/null || true; cp -r showcase _site/ 2>/dev/null || true; cp -r privacy terms login _site/ 2>/dev/null || true
          if git clone -q --depth 1 --branch politicians "$repo" pol_db 2>/dev/null; then
            mkdir -p _site/data/pol && cp -r pol_db/index.json pol_db/people _site/data/pol/ && (cp -r pol_db/photos _site/data/pol/ || true) && (cp pol_db/feed.json _site/data/pol/ || true)
          fi
          test -f _site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
