name: people
# 인물 명부(국회의원 역대 전체 + 위키데이터 한국 인물 전체 + 해외 주요 인물 + 뉴스에서 새로 찾은 인물)를 매주 다시 만들고,
# 지금까지 쌓인 모든 기사를 인물별 타임라인(data 브랜치 db/people/)에 다시 맞춰 봄. 평소에는 collect가 30분마다 새 기사만 더함
on:
  schedule:
    - cron: '23 18 * * 6'   # 일요일 03:23 KST
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: people, cancel-in-progress: false }
jobs:
  people:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      # data는 자주 쓰이는 별도 브랜치다. actions/checkout의 참조 해석이 지연될
      # 때가 있어, Pages 배포에서 검증된 얕은 clone 경로로 고정한다.
      - name: data 스냅샷 가져오기
        timeout-minutes: 3
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --depth 1 --branch data "$repo" data
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 국회의원·연표 대상 가져오기
        run: |
          repo="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch politicians "$repo" pol_db || mkdir pol_db
          git clone -q --depth 1 --branch legal "$repo" legal_db || mkdir legal_db
          git clone -q --depth 1 --branch history "$repo" hist || mkdir hist
      - name: 인물 명부
        timeout-minutes: 30
        run: python scripts/people/registry.py data pol_db hist
      - name: 모든 기사 → 인물 타임라인
        env: { PEOPLE_SEC: '900' }
        run: python scripts/people/mentions.py data
      - name: 인물사전 마스터 DB 풀 리빌드
        env:
          POLITICIANS_DIR: pol_db
          LEGAL_DIR: legal_db
        run: python scripts/people/collect_bio.py
      - name: 인물 데이터 충족도·검증 보강 큐 갱신
        # 명부 수와 실제 출처 기반 프로필 수를 분리해 기록하고, 이름 검색 없이
        # 고정 Wikidata ID가 있는 1계층 인물만 다음 보강 대상으로 남긴다.
        run: python scripts/people/coverage.py data --pol-dir pol_db
      - name: data 브랜치에 저장
        working-directory: data
        run: |
          git config user.name "newsboard-bot"; git config user.email "actions@users.noreply.github.com"
          git add db/people people_bio.json.gz   # people_bio.json(73MB 원본)은 git에 안 둠: data/.gitignore, 판본은 R2 원장(ledger.yml put_file)
          git diff --cached --quiet && exit 0
          git commit -qm "people: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          # 비압축 원본은 배포·Git 대상이 아닌 워커 전용 중간산출물이다.
          # 남겨두면 동시 수집자가 data를 갱신했을 때 rebase/merge를 막는다.
          rm -f people_bio.json
          for n in 1 2 3 4 5 6; do
            git push -q origin HEAD:data && exit 0
            sleep $((n * 10 + RANDOM % 10))
            if git fetch -q origin data && git rebase -q -X theirs origin/data; then
              :
            else
              git rebase --abort 2>/dev/null || true
              git merge -q -X ours --no-edit origin/data
            fi
          done
          exit 1
