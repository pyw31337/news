name: legal-archive
# 법률 데이터 지속 수집(admin 전용 시안용). 저장: 'legal' 브랜치 legal/v1/ (D1 미사용). 스키마: scripts/legal/SCHEMA.md
on:
  schedule:
    - cron: '50 */3 * * *'   # 3시간마다 50분
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: legal, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts }
      - name: legal 브랜치 가져오기(없으면 새로 만듦)
        run: |
          if git ls-remote --exit-code --heads origin legal >/dev/null; then
            git clone --depth 1 --branch legal "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lg
          else
            mkdir lg && cd lg && git init -b legal && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
      - uses: actions/checkout@v4
        with: { ref: data, path: dd, sparse-checkout: db/articles }
        continue-on-error: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 수집
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/legal/collect.py lg dd/db/articles
      - name: 저장
        run: |
          cd lg && git config user.name newsboard-bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "legal $(date -u +%FT%H:%MZ)" || exit 0
          for i in 1 2 3; do git push origin HEAD:legal && break; git pull --rebase -X theirs origin legal; done
