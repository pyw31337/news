name: macmini-health

on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency: { group: macmini-health, cancel-in-progress: true }

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: 맥미니 산출물 heartbeat 점검
        run: python3 scripts/macmini_health.py data --output reports/macmini-health.json
      - name: 점검 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macmini-health
          path: reports/macmini-health.json
          retention-days: 30
