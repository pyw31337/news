name: collect-news
on:
  schedule:
    - cron: '7,37 * * * *' # 30분마다 수집(자체 DB 빠르게 채우기) + 가벼운 AI 분석
    - cron: '40 21 * * *'  # 매일 06:40 KST 심층 분석(AI 호출 예산 확대)
  workflow_dispatch:
    inputs:
      deep: { description: '심층 분석 모드', type: boolean, default: false }
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
concurrency: { group: collect, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - name: 누적 데이터(data 브랜치) 가져오기
        uses: actions/checkout@v4
        with: { ref: data, path: data }
      - name: 썸네일 저장소(media 브랜치) 가져오기 — 없으면 새로 만듦
        run: |
          if git ls-remote --exit-code --heads origin media >/dev/null; then
            git clone -q --depth 1 --branch media "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
          else
            mkdir media && cd media && git init -q -b media && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/collect.py
      - name: 인물 사진·로고·국기 WebP 보관(여러 화면에서 반복해 쓰는 그래픽이라 먼저 확보)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/entity_assets.py
      - name: enrich (흐름·여론·시장·용어·AI)
        env:
          # AI 분석: Secret LLM_API_KEY 필수(기본 Gemini OpenAI 호환). 다른 LLM은 Variables LLM_ENDPOINT·LLM_MODEL로 교체
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BUDGET: ${{ (github.event.schedule == '40 21 * * *' || inputs.deep) && '40' || '3' }}  # Gemini 무료 등급(하루 약 250회) 안: 30분×3 + 심층 40 ≈ 하루 180회
        run: python scripts/enrich.py
      - name: 읽기 수준 맞춤(쉬운 말 요약 · 용어 풀이)
        continue-on-error: true
        timeout-minutes: 3
        env:
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/easy.py
      - name: 네이버 뉴스·이미지 검색(NAVER API HUB, 월 28만 회 상한)
        continue-on-error: true
        timeout-minutes: 3
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_BUDGET: ${{ (github.event.schedule == '40 21 * * *' || inputs.deep) && '60' || '20' }}  # 30분×최대 20 ≈ 월 3만 회
        run: python scripts/naver.py
      - name: 해외 뉴스(번역)
        continue-on-error: true
        timeout-minutes: 12
        run: python scripts/global_news.py
      - name: 해외 이슈 AI 해설(요약·배경·왜 중요한가 · 영어 원문+한국어)
        continue-on-error: true
        timeout-minutes: 4
        env:
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/global_ai.py
      - name: 해외 유명 인물·언론 SNS(트루스소셜 아카이브·블루스카이 공개 API)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/social.py
      - name: 전국 날씨(17개 생활권 현재·시간대·주간 예보)
        continue-on-error: true
        timeout-minutes: 2
        # Open-Meteo 예보는 키 없이 수집 가능하다. 기상청 특보는 맥미니의 data.go.kr 수집을 계속 우선한다.
        run: python scripts/kr_gov.py weather
      - name: 글로벌 이상기후·세계 날씨 수집
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/global_weather.py
      # 재정경제부 보도자료·기상·실거래가·주식시세·선관위: data.go.kr이 해외 IP를 막아서 맥미니(local/gov/run_gov.sh)가 매시 data 브랜치 gov/·briefs.json에 올림
      - name: 공식 통계·공시(ECOS·DART)
        continue-on-error: true
        timeout-minutes: 3
        env: { ECOS_API_KEY: '${{ secrets.ECOS_API_KEY }}', DART_API_KEY: '${{ secrets.DART_API_KEY }}' }
        run: python scripts/official.py
      - name: 경제지표 시계열(ECOS)
        continue-on-error: true
        timeout-minutes: 4
        env: { ECOS_API_KEY: '${{ secrets.ECOS_API_KEY }}' }
        run: python scripts/ecos_series.py
      - name: 시가총액 상위 종목 일별 시세(네이버 금융, 6시간마다 — 금융위 API 보조)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/stocks_naver.py
      - name: 마켓 상세(차트 60일·2년, 시세, 투자자별 매매, 환전 고시)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/market_detail.py
      - name: 놀면서 배우기(단어 퀴즈·4컷 만화·카드뉴스)
        continue-on-error: true
        timeout-minutes: 5
        env:
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/fun.py
      - name: 오늘의 OX(레벨별 · 한국어/영어, 날짜별 누적)
        continue-on-error: true
        timeout-minutes: 4
        env:
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/quiz.py
      - name: 민심·영상(블로그·카페 반응 + 방송사 영상, 유튜브 키 없어도 동작)
        continue-on-error: true
        timeout-minutes: 6
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/voice.py
      - name: 자체 DB(기사·엔티티 백필)·썸네일 WebP
        continue-on-error: true
        timeout-minutes: 13
        run: python scripts/db.py
      - name: 아카이브 보강(해외 뉴스·시장 지표도 날짜별로 남김)
        continue-on-error: true
        run: python scripts/archive_extra.py
      - name: 같은 내용 기사 묶기·묶음 요약 보관(db/dupes)
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/dedupe.py
      - name: 인물 타임라인(새 기사 → 등장 인물별로 쌓기)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/people/mentions.py data
      - name: 인물사전 바이오 DB 지속 수집·누적
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/people/collect_bio.py --incremental
      - name: 오늘의 이슈 정합성 검증 및 소독(Sanitize)
        run: python scripts/sanitize_today.py data/today.json
      - name: 품질 점수(사진·기사·이슈·인물 채점 → 좋은 것 먼저 배열, docs/QUALITY.md)
        continue-on-error: true
        timeout-minutes: 6
        run: python scripts/quality.py data/today.json
      - name: 편집 제작 큐(근거·원인·수치·다음 지표 · 에이전트 인수인계용)
        continue-on-error: true
        timeout-minutes: 2
        env: { FUN_DATA: data }
        run: |
          python scripts/editorial_queue.py
          # 검수 실패는 로그에 남기되, 이미 수집한 원본 데이터를 멈추거나 버리지는 않는다.
          python scripts/editorial_queue.py --validate
      - name: 관리자 상태(status.json·실행 이력)
        if: always()
        continue-on-error: true
        run: python scripts/status.py
      - name: 데이터 수집 현황판(관리자, data/stats.json)
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/stats.py
      - name: 메뉴별 상세 현황(관리자, data/stats_detail.json)
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        env: { GH_TOKEN: '${{ github.token }}' }
        run: python scripts/stats_detail.py
      - name: 누적 데이터 커밋(data 브랜치)
        working-directory: data
        run: |
          git config user.name "newsboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # 수집 중간 파일(_arts.json)은 저장하지 않음 — 남아 있으면 다른 실행과 '수정/삭제' 충돌이 남
          grep -qx '_arts.json' .git/info/exclude 2>/dev/null || echo '_arts.json' >> .git/info/exclude
          git rm -q --cached --ignore-unmatch _arts.json
          commit_generated() {
            # rebase 전 반드시 인덱스와 작업 트리를 깨끗하게 만든다. 이 보장이
            # 없으면 동시 푸시 뒤 "cannot rebase: unstaged changes"로 끝난다.
            git rm -q --cached --ignore-unmatch _arts.json
            git add -A
            # 메인 워킹트리는 data/를 무시하지만 data 브랜치에는 인수인계 큐를 보존한다.
            git add -f editorial/queue.json 2>/dev/null || true
            git diff --cached --quiet || git commit -qm "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          }
          commit_generated
          # 맥미니(overlay/·정치인)와 동시에 저장해도: 현재 수집 결과를 우선해
          # 최신 data 위로 재적용한다. 강제 푸시나 reset은 사용하지 않는다.
          for n in 1 2 3 4 5 6; do
            git push -q origin HEAD:data && exit 0
            sleep $((n * 10 + RANDOM % 10))
            commit_generated
            git fetch -q --unshallow origin data 2>/dev/null || git fetch -q origin data
            if ! git rebase -q -X theirs origin/data; then
              # rebase 중 'theirs'는 지금 이 실행에서 만든 커밋이다. 충돌 파일도
              # 현재 수집본을 보존한 뒤 계속 진행한다.
              while conflicts="$(git diff --name-only --diff-filter=U)" && [ -n "$conflicts" ]; do
                while IFS= read -r f; do git checkout -q --theirs -- "$f" && git add -- "$f"; done <<< "$conflicts"
                GIT_EDITOR=true git rebase --continue >/dev/null 2>&1 || true
              done
              # 자동 해결할 수 없는 구조 충돌은 다음 재시도에서 최신을 다시
              # 받아 처리한다. 진행 중 rebase 상태를 남겨 두지 않는다.
              git rev-parse -q --verify REBASE_HEAD >/dev/null && git rebase --abort || true
            fi
          done
          exit 1
      - name: 썸네일 커밋(media 브랜치, 이력은 1개 커밋으로 유지해 용량 증가 방지)
        continue-on-error: true
        working-directory: media
        run: |
          git config user.name "newsboard-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q --amend -m "media: thumbnails (WebP)" 2>/dev/null || git commit -qm "media: thumbnails (WebP)"
            git push -q -f origin HEAD:media
          fi
      - name: 데이터 브랜치 용량 관리(.git 400MB 넘으면 최신 상태 1개 커밋으로 압축)
        working-directory: data
        run: |
          git fetch -q --unshallow 2>/dev/null || true
          SZ=$(git count-objects -vH | awk '/size-pack/{print $2$3}'); echo "pack: $SZ"
          KB=$(git count-objects -v | awk '/size-pack/{print $2}')
          if [ "$KB" -gt 409600 ]; then
            git checkout -q --orphan squash && git add -A && git commit -qm "data: squashed $(TZ=Asia/Seoul date '+%Y-%m-%d') KST" && git push -q -f origin squash:data
          fi
      - name: 사이트 묶기
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir _site && cp -r index.html assets icons admin v2 manifest.webmanifest sw.js og-image.png favicon.ico _site/
          mkdir _site/data && cp -r data/today.json data/archive _site/data/ && (cp data/global.json data/status.json _site/data/ || true); (cp data/briefs.json _site/data/ 2>/dev/null || true); (cp data/official.json _site/data/ 2>/dev/null || true); (cp data/elite_network.json _site/data/ 2>/dev/null || true); (cp data/ecos_series.json _site/data/ 2>/dev/null || true); (cp data/stats.json data/stats_detail.json _site/data/ 2>/dev/null || cp data/stats.json _site/data/ 2>/dev/null || true); (cp data/market_detail.json _site/data/ 2>/dev/null || true); (cp -r data/gov _site/data/ 2>/dev/null || true); (cp data/voice.json _site/data/ 2>/dev/null || true); (cp data/quiz.json _site/data/ 2>/dev/null || true); (cp data/social.json _site/data/ 2>/dev/null || true); (cp data/fun.json _site/data/ 2>/dev/null && python scripts/fun_og.py _site || true); (cp -r data/fun _site/data/ 2>/dev/null || true); (cp -r data/editorial _site/data/ 2>/dev/null || true)
          (mkdir -p _site/media && cp -r media/img _site/media/ 2>/dev/null; cp -r media/ent _site/media/ 2>/dev/null || true)
          python scripts/build_pages.py _site
          python scripts/split_today.py _site || true
          python scripts/inject_cache_version.py _site || true
          # 정치인 DB(politicians 브랜치, scripts/politicians·politicians.yml 참고)
          cp -r politicians _site/ 2>/dev/null || true; cp -r persons _site/ 2>/dev/null || true; cp -r history _site/ 2>/dev/null || true; cp -r games _site/ 2>/dev/null || true; cp -r privacy terms login _site/ 2>/dev/null || true
          if git clone -q --depth 1 --branch politicians "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pol_db 2>/dev/null; then
            mkdir -p _site/data/pol && cp -r pol_db/index.json pol_db/people _site/data/pol/ && (cp -r pol_db/photos _site/data/pol/ || true) && (cp pol_db/feed.json _site/data/pol/ || true)
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
