name: collect-news
on:
  schedule:
    - cron: '7 * * * *'   # 매시 7분 (UTC) 수집
  workflow_dispatch:
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/collect.py
      - name: commit data
        run: |
          git config user.name "newsboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git pull --rebase -q && git push
