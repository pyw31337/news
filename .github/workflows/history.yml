name: news-history
# 과거 뉴스 히스토리(수년~수십년) 백필: 인물 블랙박스(정치인·연예인·인플루언서) + 반복 이슈 연표 + 연도별 사건 + 세계 시장 지표
# 저장: 'history' 브랜치 정적 파일(D1 사용 안 함). 공개 저장소라 GitHub Actions 분량 무료.
on:
  schedule:
    - cron: '15 * * * *'      # 매시 15분(KST 동일 분), 회당 약 42분 수집
  workflow_dispatch:
    inputs:
      minutes: { description: '수집 시간(분)', default: '42' }
permissions: { contents: write, actions: write }   # actions: 끝나면 다음 회차를 스스로 실행
concurrency: { group: history, cancel-in-progress: false }
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts/history }
      - name: history 브랜치 가져오기(없으면 새로 만듦)
        run: |
          if git ls-remote --exit-code --heads origin history >/dev/null; then
            git clone --depth 1 --branch history "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hist
          else
            mkdir hist && cd hist && git init -b history && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi
      - uses: actions/checkout@v4
        with: { ref: politicians, path: pdata, sparse-checkout: index.json, sparse-checkout-cone-mode: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 대상 목록(주 1회 또는 없을 때)
        run: |
          if [ ! -f hist/h/targets.json ] || [ "$(date -u +%u%H)" = "718" ]; then python scripts/history/hist.py hist seed pdata || true; fi
          if [ ! -f hist/h/y/2000.json ] || [ "$(date -u +%H)" = "19" ]; then python scripts/history/hist.py hist years 1948 $(date +%Y) || true; fi
      - name: 세계 시장 지표(3시간마다)
        run: |
          # 10#: '08'·'09'시를 8진수로 읽어 단계가 1초 만에 실패하던 문제(2026-10-30)
          if [ $(( 10#$(date -u +%H) % 3 )) = 0 ] || [ ! -f hist/h/market_extra.json ]; then timeout 240 python scripts/history/market_extra.py hist/h/market_extra.json || true; fi
      - name: 단계형 화제 타임라인(최근 7일·30일 화제 먼저 → 성숙하면 1년·3년·5년 확장, stage.py)
        run: timeout 900 python scripts/history/stage.py hist 12 || true
      - name: 인물·이슈 백필(남은 시간)
        run: |
          M=${{ github.event.inputs.minutes || '42' }}; M=$(( M > 20 ? M - 12 : M ))
          python scripts/history/hist.py hist run $M
      - name: 저장
        run: |
          cd hist && git config user.name newsboard-bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "history $(date -u +%FT%H:%MZ)" || exit 0
          for i in 1 2 3; do git push origin HEAD:history && break; git pull --rebase -X theirs origin history; done
      # GitHub 예약 실행은 붐빌 때 자주 건너뛰어져(하루 3~4회만 돎) → 할 일이 남아 있으면 다음 회차를 바로 이어서 실행.
      # 할 일 = 처음 백필이 안 끝난 대상 + 24시간 넘게 갱신 안 된 대상(2026-11-05 첫 백필이 끝난 뒤 '남은 대상 0'이라
      # 이어 실행이 멈추고 예약 실행만 하루 3회 남던 문제, 2026-11-11 수정). 한 회차 약 35분이라 이어 실행 = 대략 매시 1회.
      # 실패했거나 3분도 안 돼 끝난 회차는 이어 실행하지 않음(빠른 실패가 수백 번 연달아 도는 것 방지) → 다음 매시 예약 실행이 다시 시작
      - name: 다음 회차 이어 실행
        if: success()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          read left stale < <(python3 -c "
          import json,time
          t=json.load(open('hist/h/targets.json')); s=json.load(open('hist/h/state.json')); now=time.time()
          ids=[x.get('id') if isinstance(x,dict) else x for x in t]
          print(sum(1 for i in ids if not (s.get(i) or {}).get('full')), sum(1 for i in ids if now-(s.get(i) or {}).get('at',0)>86400))" 2>/dev/null || echo "1 1")
          el=$(( $(date +%s) - ${T0:-0} )); echo "처음 백필 남은 대상: $left · 24시간 넘은 대상: $stale · 이번 회차 ${el}초"
          if [ "$el" -lt 180 ]; then echo "너무 빨리 끝나 이어 실행하지 않음"; exit 0; fi
          if [ "$left" != "0" ] || [ "$stale" != "0" ]; then gh workflow run history.yml --ref main -R ${{ github.repository }} || true; fi
