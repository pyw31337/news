name: build-intelligence-ledgers

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: intelligence-ledgers, cancel-in-progress: false }

jobs:
  ontology:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: data }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build ontology graph when source ledgers are available
        run: python scripts/ontology/knowledge_graph.py
      - name: Extract new evidence-backed relations
        run: python scripts/ontology/relation_extractor.py
      - name: Build serendipity radar
        run: python scripts/ontology/serendipity_radar.py
      - name: Build Letsro precedent ledger
        run: python scripts/lawtech/precedents_engine.py
      - name: Build Letsinsu policy ledger
        run: python scripts/insu/policy_terms_engine.py
      - name: Publish generated graph to data branch
        working-directory: data
        run: |
          git config user.name "newsboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f ontology_graph.json serendipity_insights.json extracted_relations.json lawtech/precedents_db.json insu/policy_terms_db.json 2>/dev/null || true
          git diff --cached --quiet || git commit -qm "data: ontology graph"
          for n in 1 2 3; do
            git push -q origin HEAD:data && exit 0
            git fetch -q origin data
            git merge -q --no-edit -X ours origin/data || { git merge --abort || true; }
          done
          exit 1
