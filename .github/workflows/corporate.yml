name: corporate-intelligence
# DART 공시가 쌓인 뒤 대표·등기임원·직원 표를 점진적으로 추출한다.
# 기존 뉴스 수집과 분리해 한 번의 DART 파싱 실패가 뉴스 배포를 막지 않게 한다.
on:
  schedule:
    - cron: '30 19 * * *' # 매일 04:30 KST
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: corporate-intelligence, cancel-in-progress: false }
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: data 브랜치 준비
        run: |
          repo="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 --branch data "$repo" data
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 기업 기본 도시에 구축
        run: |
          python scripts/corporate_dossier.py
          python scripts/dart_executives.py
      - name: 결과 저장
        run: |
          cd data
          git config user.name newsboard-bot
          git config user.email bot@users.noreply.github.com
          git add corporate_dossier.json db/corps elite_network.json people_bio.json 2>/dev/null || true
          git commit -qm "corporate intelligence $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST" || exit 0
          for i in 1 2 3; do
            git push origin HEAD:data && break
            git pull --rebase -X theirs origin data
          done
